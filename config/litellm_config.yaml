model_list:
  - model_name: cerebro-groq
    litellm_params:
      model: "groq/openai/gpt-oss-20b"
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-deepinfra
    litellm_params:
      model: "deepinfra/meta-llama/Llama-3.3-70B-Instruct"
      api_key: os.environ/DEEPINFRA_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-deepinfra-qwen
    litellm_params:
      model: "deepinfra/Qwen/Qwen2.5-72B-Instruct"
      api_key: os.environ/DEEPINFRA_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-gemini
    litellm_params:
      model: "gemini/gemini-3.8-flash"
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.15
      max_tokens: 2000

litellm_settings:
  drop_params: true
  num_retries: 2
  timeout: 30

router_settings:
  fallback_model: "cerebro-deepinfra"
  max_parallel_requests: 5
