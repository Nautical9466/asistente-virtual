model_list:
  - model_name: cerebro-groq
    litellm_params:
      model: "groq/openai/gpt-oss-20b"
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-groq-qwen
    litellm_params:
      model: "groq/qwen/qwen3.8-27b"
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-groq-fast
    litellm_params:
      model: "groq/openai/gpt-oss-20b"
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.15
      max_tokens: 2000

litellm_settings:
  drop_params: true
  num_retries: 2
  timeout: 30

router_settings:
  fallback_model: "cerebro-groq-fast"
  max_parallel_requests: 5
