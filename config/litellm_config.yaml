model_list:
  - model_name: cerebro-deepinfra-qwen
    litellm_params:
      model: "deepinfra/Qwen/Qwen2.5-32B-Instruct"
      api_key: os.environ/DEEPINFRA_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-groq
    litellm_params:
      model: "groq/llama-3.3-70b-versatile"
      api_key: os.environ/GROQ_API_KEY
      temperature: 0.15
      max_tokens: 2000

  - model_name: cerebro-gemini
    litellm_params:
      model: "gemini/gemini-2.0-flash"
      api_key: os.environ/GEMINI_API_KEY
      temperature: 0.15
      max_tokens: 2000

litellm_settings:
  drop_params: true
  num_retries: 2
  timeout: 30

router_settings:
  fallback_model: "cerebro-groq"
  max_parallel_requests: 5
